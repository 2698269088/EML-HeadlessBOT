distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Official source on purpose. A domestic mirror is faster for local builds, but this repository is also
# built by JitPack, whose machines sit outside China: pulling the distribution from a mirror hosted here
# slows that build down badly. Local machines that already ran a build once keep their cached copy under
# GRADLE_USER_HOME/wrapper/dists and are unaffected by this URL.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
