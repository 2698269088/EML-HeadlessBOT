# EMLPga - advertising for the headless bot.
#
# Everything here is also changeable at runtime with '/emlpga epa <sub>', which writes the same file, so
# this is a starting point rather than the only way in.

enabled: false
# zh_cn / en_us. Missing keys fall back to zh_cn, then to the key itself.
language: zh_cn

schedule:
  # One "round" is: pick the message list, then send it message by message.
  publicIntervalSeconds: 40
  privateIntervalSeconds: 10
  # public = one line in chat; private = '/msg <player>' to each non-blacklisted player in turn.
  mode: public
  # Pause between two messages of the same round.
  gapSeconds: 4
  # Round interval and gap are randomised in [base - jitter, base + jitter]; 0 disables the jitter.
  jitterSeconds: 5
  gapJitterSeconds: 3
  # true = one random message per round instead of the whole list.
  randomOne: false
  # Do not send the same text twice in a row (an extra guard on top of the suffix below).
  skipRepeats: true

text:
  # Appending a short random tail makes every line unique, which defeats servers that mute repeated text.
  suffix:
    enabled: true
    length: 4
  # Replace runs of digits with mathematical-bold glyphs. Off by default: the client font used by many
  # servers has no glyphs for that block, so the digits can render as boxes.
  mathFont:
    enabled: false
    burstMathFont: false
    minDigits: 5

greeting:
  # Greet players the moment they appear in the tab list.
  enabled: false
  # #name# player, #bot# this bot, #players# online count.
  format: "hi，#name#，公告机器人 #bot# 在线，输入 /emlpga epa help 查看指令"

burst:
  # A fast public loop that runs WHILE the main mode is private. This mirrors the original plugin's
  # "multi-thread" feature: private rounds go to individuals, the burst keeps the public chat busy.
  enabled: false
  intervalSeconds: 2
  durationSeconds: 30
  # Wait between two burst windows.
  checkSeconds: 5
  # Mirror edits of the main list into the burst list.
  syncWithMain: false

# The advertisement lines. #name# #players# #bot# #time# are substituted at send time.
messages:
  - "欢迎来到本服"
  - "本机器人由 EML-HeadlessBOT 驱动"
  - "有问题请在公屏提问，管理会尽快回复"

# Independent list for the burst window; falls back to 'messages' when empty.
burstMessages:
  - "本服正在正常运行"
  - "在线玩家: #players#"

# Players never messaged by private rounds.
blacklist: []
